<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Teleprompter Camera 2.0</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
}

#app{
    position:relative;
    width:100%;
    height:100dvh;
    background:#000;
}

#preview{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

#preview.mirror{
    transform:scaleX(-1);
}

#shade{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.55),
            transparent 25%,
            transparent 65%,
            rgba(0,0,0,.8)
        );
    pointer-events:none;
}

#prompt{
    position:absolute;
    left:7%;
    right:7%;
    top:24%;
    height:38%;
    overflow:hidden;
    text-align:center;
    font-weight:700;
    font-size:32px;
    line-height:1.35;
    text-shadow:0 2px 6px #000;
    pointer-events:none;
}

#script{
    padding:35px 0 100px;
    white-space:pre-wrap;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.badge{
    background:rgba(0,0,0,.58);
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    backdrop-filter:blur(10px);
}

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:14px 16px 20px;
    z-index:6;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.92) 28%
    );
}

.row{
    display:flex;
    gap:8px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
}

button,select{
    border:0;
    border-radius:14px;
    padding:11px 14px;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:14px;
    font-weight:650;
}

select{
    appearance:none;
}

button:active{
    transform:scale(.97);
}

#record{
    width:66px;
    height:66px;
    border-radius:50%;
    padding:0;
    background:#fff;
    border:5px solid rgba(255,255,255,.45);
    background-clip:padding-box;
}

#record.on{
    background:#e53935;
}

#editor{
    display:none;
    position:absolute;
    inset:0;
    z-index:20;
    background:#101010;
    padding:18px;
    overflow:auto;
}

#editor textarea{
    width:100%;
    height:55dvh;
    border-radius:14px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
    padding:15px;
    font-size:17px;
    line-height:1.5;
    resize:none;
}

#editor .row{
    margin-top:12px;
}

#status{
    text-align:center;
    font-size:12px;
    opacity:.8;
    margin-top:8px;
}

#qualityInfo{
    text-align:center;
    font-size:11px;
    opacity:.65;
    margin-top:5px;
}
</style>
</head>

<body>

<div id="app">

    <video id="preview" autoplay playsinline muted></video>

    <div id="shade"></div>

    <div id="top">
        <span class="badge" id="timer">00:00</span>
        <span class="badge" id="state">READY</span>
    </div>

    <div id="prompt">
        <div id="script"></div>
    </div>

    <div id="controls">

        <div class="row">

            <button id="edit">Script</button>

            <button id="flip">Mirror</button>

            <button id="sizeMinus">A−</button>

            <button id="sizePlus">A+</button>

            <button id="speedMinus">Speed −</button>

            <button id="speedPlus">Speed +</button>

        </div>

        <div class="row" style="margin-top:9px">

            <select id="quality">

                <option value="1080">1080p / 30fps</option>

                <option value="720">720p / 30fps</option>

                <option value="max">Maximum supported</option>

            </select>

            <button id="reset">Reset</button>

            <button id="record" aria-label="Record"></button>

            <button id="scrollToggle">Auto-scroll</button>

        </div>

        <div id="status">
            Starting camera...
        </div>

        <div id="qualityInfo">
            Detecting camera capabilities...
        </div>

    </div>


    <div id="editor">

        <h2 style="margin-top:0">
            Your script
        </h2>

        <textarea
            id="textarea"
            spellcheck="false">
        </textarea>

        <div class="row">

            <button id="saveScript">
                Use script
            </button>

            <button id="closeEditor">
                Cancel
            </button>

        </div>

    </div>

</div>


<script>

/* =========================================================
   TELEPROMPTER CAMERA 2.0
   ========================================================= */


const video = document.getElementById("preview");
const scriptEl = document.getElementById("script");
const prompt = document.getElementById("prompt");
const textarea = document.getElementById("textarea");

const timerEl = document.getElementById("timer");
const stateEl = document.getElementById("state");

const statusEl = document.getElementById("status");
const qualityInfo = document.getElementById("qualityInfo");

const recordBtn = document.getElementById("record");
const qualitySelect = document.getElementById("quality");


/* =========================================================
   STATE
   ========================================================= */

let stream = null;
let recorder = null;
let chunks = [];

let recording = false;

let mirrored = true;

let autoScroll = false;

let fontSize = 32;

let speed = 25;

let rafId = null;

let lastFrame = 0;

let elapsed = 0;

let timerId = null;


/* =========================================================
   SCRIPT
   ========================================================= */

let scriptText =
localStorage.getItem("tp-script") ||

`There are four forms of scalable leverage.

And most entrepreneurs only use one.

The goal isn't to work harder.

It's to build something where your output can grow without your hours growing at the same rate.

That's what leverage does.`;


function renderScript(){

    scriptEl.textContent = scriptText;

    textarea.value = scriptText;

}

renderScript();


/* =========================================================
   CAMERA QUALITY PRESETS
   ========================================================= */

function getVideoConstraints(){

    const quality = qualitySelect.value;


    /* 1080P */

    if(quality === "1080"){

        return {

            facingMode:"user",

            width:{
                ideal:1920,
                min:1280
            },

            height:{
                ideal:1080,
                min:720
            },

            frameRate:{
                ideal:30,
                min:24,
                max:30
            }

        };

    }


    /* 720P */

    if(quality === "720"){

        return {

            facingMode:"user",

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            },

            frameRate:{
                ideal:30,
                max:30
            }

        };

    }


    /* MAXIMUM */

    return {

        facingMode:"user",

        width:{
            ideal:3840
        },

        height:{
            ideal:2160
        },

        frameRate:{
            ideal:30,
            max:30
        }

    };

}


/* =========================================================
   START CAMERA
   ========================================================= */

async function startCamera(){

    try{

        if(stream){

            stream.getTracks().forEach(track=>{
                track.stop();
            });

        }


        statusEl.textContent =
        "Starting high-quality camera...";


        stream =
        await navigator.mediaDevices.getUserMedia({

            video:getVideoConstraints(),

            audio:{

                echoCancellation:true,

                noiseSuppression:true,

                autoGainControl:true

            }

        });


        video.srcObject = stream;


        await video.play();


        inspectCamera();


    }

    catch(error){

        console.error(error);

        statusEl.textContent =
        "Camera error: " + error.name;

        qualityInfo.textContent =
        error.message || "";

    }

}


/* =========================================================
   INSPECT ACTUAL CAMERA SETTINGS
   ========================================================= */

function inspectCamera(){

    if(!stream) return;


    const track =
    stream.getVideoTracks()[0];


    const settings =
    track.getSettings();


    const width =
    settings.width || "?";

    const height =
    settings.height || "?";

    const fps =
    settings.frameRate
    ? Math.round(settings.frameRate)
    : "?";


    qualityInfo.textContent =
    `Actual camera: ${width} × ${height} @ ${fps}fps`;


    statusEl.textContent =
    "Camera ready.";

}


/* =========================================================
   CAMERA CAPABILITIES
   ========================================================= */

function inspectCapabilities(){

    if(!stream) return;


    const track =
    stream.getVideoTracks()[0];


    const capabilities =
    track.getCapabilities();


    console.log(
        "Camera capabilities:",
        capabilities
    );

}


/* =========================================================
   TIMER
   ========================================================= */

function formatTime(seconds){

    seconds =
    Math.floor(seconds);


    return (

        String(
            Math.floor(seconds / 60)
        ).padStart(2,"0")

        +

        ":"

        +

        String(
            seconds % 60
        ).padStart(2,"0")

    );

}


function startClock(){

    clearInterval(timerId);


    timerId =
    setInterval(()=>{

        elapsed++;

        timerEl.textContent =
        formatTime(elapsed);

    },1000);

}


function stopClock(){

    clearInterval(timerId);

}


/* =========================================================
   TELEPROMPTER SCROLL
   ========================================================= */

function startScroll(){

    cancelAnimationFrame(rafId);


    lastFrame =
    performance.now();


    function tick(now){

        if(!autoScroll)
            return;


        const delta =
        (now-lastFrame)/1000;


        lastFrame = now;


        prompt.scrollTop +=
        speed * delta;


        if(

            prompt.scrollTop +
            prompt.clientHeight >=
            prompt.scrollHeight - 2

        ){

            autoScroll = false;

            stateEl.textContent =
            recording
            ? "RECORDING"
            : "READY";

            return;

        }


        rafId =
        requestAnimationFrame(tick);

    }


    rafId =
    requestAnimationFrame(tick);

}


function setAutoScroll(enabled){

    autoScroll =
    enabled;


    document.getElementById(
        "scrollToggle"
    ).textContent =
    enabled
    ? "Pause scroll"
    : "Auto-scroll";


    if(enabled){

        startScroll();

    }else{

        cancelAnimationFrame(rafId);

    }

}


/* =========================================================
   RESET
   ========================================================= */

function resetPrompt(){

    prompt.scrollTop = 0;

    elapsed = 0;

    timerEl.textContent = "00:00";

}


/* =========================================================
   FIND BEST RECORDING MIME TYPE
   ========================================================= */

function getBestMimeType(){

    const types = [

        "video/webm;codecs=vp9,opus",

        "video/webm;codecs=vp8,opus",

        "video/webm",

        "video/mp4"

    ];


    for(const type of types){

        if(
            MediaRecorder.isTypeSupported(type)
        ){

            return type;

        }

    }


    return "";

}


/* =========================================================
   RECORDING
   ========================================================= */

async function startRecording(){

    if(!stream){

        await startCamera();

        if(!stream)
            return;

    }


    chunks = [];


    const mimeType =
    getBestMimeType();


    const options = {

        videoBitsPerSecond:
        10_000_000,

        audioBitsPerSecond:
        128_000

    };


    if(mimeType){

        options.mimeType =
        mimeType;

    }


    try{

        recorder =
        new MediaRecorder(
            stream,
            options
        );

    }

    catch(error){

        console.error(error);

        statusEl.textContent =
        "Recorder error. Try 720p.";

        return;

    }


    recorder.ondataavailable =
    event => {

        if(event.data.size > 0){

            chunks.push(
                event.data
            );

        }

    };


    recorder.onstop =
    saveVideo;


    recorder.start(250);


    recording = true;


    recordBtn.classList.add("on");


    stateEl.textContent =
    "RECORDING";


    statusEl.textContent =
    "Recording 1080p-quality video...";


    startClock();


    setAutoScroll(true);

}


function stopRecording(){

    if(!recorder)
        return;


    recorder.stop();


    recording = false;


    recordBtn.classList.remove("on");


    stateEl.textContent =
    "SAVING";


    statusEl.textContent =
    "Encoding video...";


    stopClock();


    setAutoScroll(false);

}


/* =========================================================
   SAVE VIDEO
   ========================================================= */

function saveVideo(){

    const mime =
    recorder.mimeType ||
    "video/webm";


    const blob =
    new Blob(
        chunks,
        {type:mime}
    );


    const url =
    URL.createObjectURL(blob);


    const extension =
    mime.includes("mp4")
    ? "mp4"
    : "webm";


    const filename =
    "teleprompter-1080p-" +
    new Date()
        .toISOString()
        .replace(/[:.]/g,"-") +
    "." +
    extension;


    const link =
    document.createElement("a");


    link.href = url;

    link.download =
    filename;


    document.body.appendChild(link);

    link.click();

    link.remove();


    setTimeout(()=>{

        URL.revokeObjectURL(url);

    },5000);


    stateEl.textContent =
    "READY";


    statusEl.textContent =
    "Video saved to Downloads.";


    inspectCamera();

}


/* =========================================================
   BUTTONS
   ========================================================= */


recordBtn.onclick = () => {

    if(recording){

        stopRecording();

    }else{

        startRecording();

    }

};


document.getElementById("flip").onclick = () => {

    mirrored = !mirrored;

    video.classList.toggle(
        "mirror",
        mirrored
    );

};


document.getElementById("sizePlus").onclick = () => {

    fontSize =
    Math.min(
        56,
        fontSize + 2
    );

    scriptEl.style.fontSize =
    fontSize + "px";

};


document.getElementById("sizeMinus").onclick = () => {

    fontSize =
    Math.max(
        18,
        fontSize - 2
    );

    scriptEl.style.fontSize =
    fontSize + "px";

};


document.getElementById("speedPlus").onclick = () => {

    speed =
    Math.min(
        100,
        speed + 5
    );

};


document.getElementById("speedMinus").onclick = () => {

    speed =
    Math.max(
        5,
        speed - 5
    );

};


document.getElementById("scrollToggle").onclick = () => {

    setAutoScroll(
        !autoScroll
    );

};


document.getElementById("reset").onclick =
resetPrompt;


/* =========================================================
   QUALITY SWITCH
   ========================================================= */

qualitySelect.onchange = async () => {

    if(recording){

        alert(
            "Stop recording before changing camera quality."
        );

        return;

    }


    await startCamera();

};


/* =========================================================
   SCRIPT EDITOR
   ========================================================= */

document.getElementById("edit").onclick = () => {

    textarea.value =
    scriptText;

    document.getElementById(
        "editor"
    ).style.display =
    "block";

};


document.getElementById("closeEditor").onclick = () => {

    document.getElementById(
        "editor"
    ).style.display =
    "none";

};


document.getElementById("saveScript").onclick = () => {

    scriptText =
    textarea.value;


    localStorage.setItem(
        "tp-script",
        scriptText
    );


    renderScript();


    resetPrompt();


    document.getElementById(
        "editor"
    ).style.display =
    "none";

};


/* =========================================================
   INITIALIZE
   ========================================================= */

scriptEl.style.fontSize =
fontSize + "px";


startCamera();

</script>

</body>
</html>
