<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Teleprompter Camera 2.1</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    width:100%;
    height:100%;
    background:#000;
    color:#fff;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
    overflow:hidden;
}

#app{
    position:relative;
    width:100%;
    height:100dvh;
    background:#000;
}

#preview{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    background:#111;
}

#preview.mirror{
    transform:scaleX(-1);
}

#shade{
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            to bottom,
            rgba(0,0,0,.55),
            transparent 25%,
            transparent 65%,
            rgba(0,0,0,.82)
        );
    pointer-events:none;
}

#prompt{
    position:absolute;
    left:7%;
    right:7%;
    top:24%;
    height:38%;
    overflow:hidden;
    text-align:center;
    font-weight:700;
    font-size:32px;
    line-height:1.35;
    text-shadow:0 2px 6px #000;
    pointer-events:none;
}

#script{
    padding:35px 0 100px;
    white-space:pre-wrap;
}

#top{
    position:absolute;
    top:0;
    left:0;
    right:0;
    padding:12px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:5;
}

.badge{
    background:rgba(0,0,0,.58);
    padding:8px 12px;
    border-radius:999px;
    font-size:13px;
    backdrop-filter:blur(10px);
}

#controls{
    position:absolute;
    left:0;
    right:0;
    bottom:0;
    padding:14px 16px 20px;
    z-index:6;
    background:linear-gradient(
        transparent,
        rgba(0,0,0,.94) 28%
    );
}

.row{
    display:flex;
    gap:8px;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
}

button,select{
    border:0;
    border-radius:14px;
    padding:11px 14px;
    background:rgba(255,255,255,.14);
    color:#fff;
    font-size:14px;
    font-weight:650;
}

button:active{
    transform:scale(.97);
}

#record{
    width:66px;
    height:66px;
    border-radius:50%;
    padding:0;
    background:#fff;
    border:5px solid rgba(255,255,255,.45);
    background-clip:padding-box;
}

#record.on{
    background:#e53935;
}

#diagnostics{
    position:absolute;
    left:10px;
    right:10px;
    top:60px;
    z-index:10;
    display:none;
    background:rgba(0,0,0,.78);
    backdrop-filter:blur(12px);
    border-radius:14px;
    padding:14px;
    font-family:monospace;
    font-size:11px;
    line-height:1.55;
}

#diagnostics.show{
    display:block;
}

.diagTitle{
    font-family:system-ui,sans-serif;
    font-size:14px;
    font-weight:700;
    margin-bottom:7px;
}

.ok{
    color:#62e06f;
}

.warn{
    color:#ffd166;
}

.bad{
    color:#ff6b6b;
}

#editor{
    display:none;
    position:absolute;
    inset:0;
    z-index:20;
    background:#101010;
    padding:18px;
    overflow:auto;
}

#editor textarea{
    width:100%;
    height:55dvh;
    border-radius:14px;
    border:1px solid #333;
    background:#181818;
    color:#fff;
    padding:15px;
    font-size:17px;
    line-height:1.5;
    resize:none;
}

#editor .row{
    margin-top:12px;
}

#status{
    text-align:center;
    font-size:12px;
    opacity:.8;
    margin-top:8px;
}

#qualityInfo{
    text-align:center;
    font-size:11px;
    opacity:.7;
    margin-top:5px;
}
</style>
</head>

<body>

<div id="app">

<video
    id="preview"
    autoplay
    playsinline
    muted>
</video>

<div id="shade"></div>

<div id="top">

    <span class="badge" id="timer">
        00:00
    </span>

    <span
        class="badge"
        id="state">
        READY
    </span>

</div>


<div id="diagnostics">

    <div class="diagTitle">
        Camera / Recorder Diagnostics
    </div>

    <div id="diagContent">
        Checking...
    </div>

</div>


<div id="prompt">

    <div id="script"></div>

</div>


<div id="controls">

    <div class="row">

        <button id="edit">
            Script
        </button>

        <button id="flip">
            Mirror
        </button>

        <button id="sizeMinus">
            A−
        </button>

        <button id="sizePlus">
            A+
        </button>

        <button id="speedMinus">
            Speed −
        </button>

        <button id="speedPlus">
            Speed +
        </button>

    </div>


    <div class="row" style="margin-top:9px">

        <select id="quality">

            <option value="1080">
                1080p / 30fps
            </option>

            <option value="720">
                720p / 30fps
            </option>

            <option value="max">
                Maximum supported
            </option>

        </select>


        <select id="codec">

            <option value="auto">
                Codec: Auto
            </option>

            <option value="h264">
                H.264 / MP4
            </option>

            <option value="vp9">
                VP9 / WebM
            </option>

            <option value="vp8">
                VP8 / WebM
            </option>

        </select>

    </div>


    <div class="row" style="margin-top:9px">

        <button id="reset">
            Reset
        </button>

        <button id="record">
        </button>

        <button id="scrollToggle">
            Auto-scroll
        </button>

        <button id="diagnosticButton">
            Info
        </button>

    </div>


    <div id="status">
        Starting camera...
    </div>

    <div id="qualityInfo">
        Detecting camera...
    </div>

</div>


<div id="editor">

    <h2 style="margin-top:0">
        Your script
    </h2>

    <textarea
        id="textarea"
        spellcheck="false">
    </textarea>

    <div class="row">

        <button id="saveScript">
            Use script
        </button>

        <button id="closeEditor">
            Cancel
        </button>

    </div>

</div>


</div>


<script>

/* =========================================================
   STATE
========================================================= */

const video =
document.getElementById("preview");

const scriptEl =
document.getElementById("script");

const prompt =
document.getElementById("prompt");

const textarea =
document.getElementById("textarea");

const timerEl =
document.getElementById("timer");

const stateEl =
document.getElementById("state");

const statusEl =
document.getElementById("status");

const qualityInfo =
document.getElementById("qualityInfo");

const recordBtn =
document.getElementById("record");

const qualitySelect =
document.getElementById("quality");

const codecSelect =
document.getElementById("codec");

const diagContent =
document.getElementById("diagContent");

const diagnostics =
document.getElementById("diagnostics");


let stream = null;

let recorder = null;

let chunks = [];

let recording = false;

let mirrored = true;

let autoScroll = false;

let fontSize = 32;

let speed = 25;

let rafId = null;

let lastFrame = 0;

let elapsed = 0;

let timerId = null;


/* =========================================================
   SCRIPT
========================================================= */

let scriptText =
localStorage.getItem("tp-script") ||

`There are four forms of scalable leverage.

And most entrepreneurs only use one.

The goal isn't to work harder.

It's to build something where your output can grow without your hours growing at the same rate.

That's what leverage does.`;


function renderScript(){

    scriptEl.textContent =
    scriptText;

    textarea.value =
    scriptText;

}

renderScript();


/* =========================================================
   MIME / CODEC SUPPORT
========================================================= */

function codecSupport(){

    const formats = {

        h264:
        "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

        h264Alt:
        "video/mp4;codecs=avc1.4D401F,mp4a.40.2",

        vp9:
        "video/webm;codecs=vp9,opus",

        vp8:
        "video/webm;codecs=vp8,opus"

    };


    return {

        h264:
        MediaRecorder.isTypeSupported(
            formats.h264
        ) ||
        MediaRecorder.isTypeSupported(
            formats.h264Alt
        ),

        vp9:
        MediaRecorder.isTypeSupported(
            formats.vp9
        ),

        vp8:
        MediaRecorder.isTypeSupported(
            formats.vp8
        )

    };

}


function getPreferredMime(){

    const support =
    codecSupport();

    const requested =
    codecSelect.value;


    /* Explicit H.264 */

    if(requested === "h264"){

        if(
            MediaRecorder.isTypeSupported(
                "video/mp4;codecs=avc1.42E01E,mp4a.40.2"
            )
        ){

            return {
                mime:
                "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

                label:
                "H.264 / MP4"
            };

        }


        if(
            MediaRecorder.isTypeSupported(
                "video/mp4;codecs=avc1.4D401F,mp4a.40.2"
            )
        ){

            return {
                mime:
                "video/mp4;codecs=avc1.4D401F,mp4a.40.2",

                label:
                "H.264 / MP4"
            };

        }


        alert(
            "H.264/MP4 is not supported by this browser. Falling back to VP9."
        );

    }


    /* Explicit VP9 */

    if(
        requested === "vp9" &&
        support.vp9
    ){

        return {

            mime:
            "video/webm;codecs=vp9,opus",

            label:
            "VP9 / WebM"

        };

    }


    /* Explicit VP8 */

    if(
        requested === "vp8" &&
        support.vp8
    ){

        return {

            mime:
            "video/webm;codecs=vp8,opus",

            label:
            "VP8 / WebM"

        };

    }


    /* AUTO
       Prefer H.264.
    */

    if(support.h264){

        return {

            mime:
            "video/mp4;codecs=avc1.42E01E,mp4a.40.2",

            label:
            "H.264 / MP4"

        };

    }


    if(support.vp9){

        return {

            mime:
            "video/webm;codecs=vp9,opus",

            label:
            "VP9 / WebM"

        };

    }


    if(support.vp8){

        return {

            mime:
            "video/webm;codecs=vp8,opus",

            label:
            "VP8 / WebM"

        };

    }


    return {

        mime:"",
        label:
        "Browser default"

    };

}


/* =========================================================
   CAMERA CONSTRAINTS
========================================================= */

function getVideoConstraints(){

    const quality =
    qualitySelect.value;


    if(quality === "1080"){

        return {

            facingMode:"user",

            width:{
                ideal:1920,
                min:1280
            },

            height:{
                ideal:1080,
                min:720
            },

            frameRate:{
                ideal:30,
                min:24,
                max:30
            }

        };

    }


    if(quality === "720"){

        return {

            facingMode:"user",

            width:{
                ideal:1280
            },

            height:{
                ideal:720
            },

            frameRate:{
                ideal:30,
                max:30
            }

        };

    }


    return {

        facingMode:"user",

        width:{
            ideal:3840
        },

        height:{
            ideal:2160
        },

        frameRate:{
            ideal:30,
            max:30
        }

    };

}


/* =========================================================
   CAMERA
========================================================= */

async function startCamera(){

    try{

        if(stream){

            stream
            .getTracks()
            .forEach(track=>{
                track.stop();
            });

        }


        statusEl.textContent =
        "Starting camera...";


        stream =
        await navigator.mediaDevices
        .getUserMedia({

            video:
            getVideoConstraints(),

            audio:{
                echoCancellation:true,
                noiseSuppression:true,
                autoGainControl:true
            }

        });


        video.srcObject =
        stream;


        await video.play();


        inspectCamera();


        updateDiagnostics();


    }

    catch(error){

        console.error(error);


        statusEl.textContent =
        "Camera error: " +
        error.name;


        qualityInfo.textContent =
        error.message || "";

    }

}


/* =========================================================
   CAMERA INFORMATION
========================================================= */

function inspectCamera(){

    if(!stream)
        return;


    const track =
    stream.getVideoTracks()[0];


    const settings =
    track.getSettings();


    const width =
    settings.width || "?";

    const height =
    settings.height || "?";

    const fps =
    settings.frameRate
    ? Math.round(
        settings.frameRate
      )
    : "?";


    qualityInfo.textContent =
    `Actual camera: ${width} × ${height} @ ${fps}fps`;


    statusEl.textContent =
    "Camera ready.";

}


/* =========================================================
   DIAGNOSTICS
========================================================= */

function updateDiagnostics(){

    const support =
    codecSupport();


    const camera =
    stream
    ? stream.getVideoTracks()[0]
        .getSettings()
    : {};


    const width =
    camera.width || "?";

    const height =
    camera.height || "?";

    const fps =
    camera.frameRate
    ? Math.round(camera.frameRate)
    : "?";


    diagContent.innerHTML = `

        CAMERA<br>

        Resolution:
        <span class="ok">
        ${width} × ${height}
        </span><br>

        Frame rate:
        <span class="ok">
        ${fps} fps
        </span><br><br>


        RECORDER SUPPORT<br>

        H.264 / MP4:
        <span class="${support.h264 ? "ok":"bad"}">
        ${support.h264 ? "SUPPORTED":"NOT SUPPORTED"}
        </span><br>

        VP9 / WebM:
        <span class="${support.vp9 ? "ok":"bad"}">
        ${support.vp9 ? "SUPPORTED":"NOT SUPPORTED"}
        </span><br>

        VP8 / WebM:
        <span class="${support.vp8 ? "ok":"bad"}">
        ${support.vp8 ? "SUPPORTED":"NOT SUPPORTED"}
        </span><br><br>


        SELECTED CODEC:
        <span class="warn">
        ${codecSelect.value.toUpperCase()}
        </span><br>

        TARGET BITRATE:
        <span class="warn">
        12 Mbps
        </span>

    `;

}


/* =========================================================
   TIMER
========================================================= */

function formatTime(seconds){

    seconds =
    Math.floor(seconds);


    return (

        String(
            Math.floor(seconds/60)
        ).padStart(2,"0")

        +

        ":"

        +

        String(
            seconds%60
        ).padStart(2,"0")

    );

}


function startClock(){

    clearInterval(timerId);


    timerId =
    setInterval(()=>{

        elapsed++;

        timerEl.textContent =
        formatTime(elapsed);

    },1000);

}


function stopClock(){

    clearInterval(timerId);

}


/* =========================================================
   SCROLL
========================================================= */

function startScroll(){

    cancelAnimationFrame(
        rafId
    );


    lastFrame =
    performance.now();


    function tick(now){

        if(!autoScroll)
            return;


        const delta =
        (now-lastFrame)/1000;


        lastFrame =
        now;


        prompt.scrollTop +=
        speed*delta;


        if(

            prompt.scrollTop +
            prompt.clientHeight >=
            prompt.scrollHeight-2

        ){

            autoScroll=false;

            return;

        }


        rafId =
        requestAnimationFrame(
            tick
        );

    }


    rafId =
    requestAnimationFrame(
        tick
    );

}


function setAutoScroll(enabled){

    autoScroll =
    enabled;


    document.getElementById(
        "scrollToggle"
    ).textContent =
    enabled
    ? "Pause scroll"
    : "Auto-scroll";


    if(enabled){

        startScroll();

    }else{

        cancelAnimationFrame(
            rafId
        );

    }

}


/* =========================================================
   RECORD
========================================================= */

async function startRecording(){

    if(!stream){

        await startCamera();

        if(!stream)
            return;

    }


    chunks=[];


    const selected =
    getPreferredMime();


    const options = {

        videoBitsPerSecond:
        12_000_000,

        audioBitsPerSecond:
        160_000

    };


    if(selected.mime){

        options.mimeType =
        selected.mime;

    }


    try{

        recorder =
        new MediaRecorder(
            stream,
            options
        );

    }

    catch(error){

        console.error(error);


        statusEl.textContent =
        "Recorder failed: " +
        error.message;


        return;

    }


    console.log(
        "Recording MIME:",
        recorder.mimeType
    );


    recorder.ondataavailable =
    event=>{

        if(event.data.size){

            chunks.push(
                event.data
            );

        }

    };


    recorder.onstop =
    saveVideo;


    recorder.start(250);


    recording=true;


    recordBtn.classList.add(
        "on"
    );


    stateEl.textContent =
    "RECORDING";


    statusEl.textContent =
    `Recording ${selected.label}...`;


    startClock();


    setAutoScroll(true);


    updateDiagnostics();

}


function stopRecording(){

    if(!recorder)
        return;


    recorder.stop();


    recording=false;


    recordBtn.classList.remove(
        "on"
    );


    stateEl.textContent =
    "SAVING";


    statusEl.textContent =
    "Preparing video...";


    stopClock();


    setAutoScroll(false);

}


/* =========================================================
   SAVE
========================================================= */

function saveVideo(){

    const mime =
    recorder.mimeType ||
    "video/webm";


    const blob =
    new Blob(
        chunks,
        {type:mime}
    );


    const url =
    URL.createObjectURL(
        blob
    );


    let extension =
    "webm";


    if(
        mime.includes("mp4")
    ){

        extension="mp4";

    }


    const filename =
    "teleprompter-" +
    extension +
    "-" +
    new Date()
    .toISOString()
    .replace(/[:.]/g,"-") +
    "." +
    extension;


    const link =
    document.createElement("a");


    link.href=url;

    link.download=
    filename;


    document.body.appendChild(
        link
    );


    link.click();


    link.remove();


    setTimeout(()=>{

        URL.revokeObjectURL(
            url
        );

    },5000);


    stateEl.textContent =
    "READY";


    statusEl.textContent =
    `Saved ${extension.toUpperCase()} video.`;

}


/* =========================================================
   BUTTONS
========================================================= */

recordBtn.onclick=()=>{

    if(recording){

        stopRecording();

    }else{

        startRecording();

    }

};


document.getElementById(
    "flip"
).onclick=()=>{

    mirrored=!mirrored;

    video.classList.toggle(
        "mirror",
        mirrored
    );

};


document.getElementById(
    "sizePlus"
).onclick=()=>{

    fontSize=
    Math.min(
        56,
        fontSize+2
    );


    scriptEl.style.fontSize =
    fontSize+"px";

};


document.getElementById(
    "sizeMinus"
).onclick=()=>{

    fontSize=
    Math.max(
        18,
        fontSize-2
    );


    scriptEl.style.fontSize =
    fontSize+"px";

};


document.getElementById(
    "speedPlus"
).onclick=()=>{

    speed=
    Math.min(
        100,
        speed+5
    );

};


document.getElementById(
    "speedMinus"
).onclick=()=>{

    speed=
    Math.max(
        5,
        speed-5
    );

};


document.getElementById(
    "scrollToggle"
).onclick=()=>{

    setAutoScroll(
        !autoScroll
    );

};


document.getElementById(
    "reset"
).onclick=()=>{

    prompt.scrollTop=0;

    elapsed=0;

    timerEl.textContent=
    "00:00";

};


/* =========================================================
   QUALITY
========================================================= */

qualitySelect.onchange=async()=>{

    if(recording){

        alert(
            "Stop recording before changing quality."
        );

        return;

    }


    await startCamera();

};


/* =========================================================
   CODEC
========================================================= */

codecSelect.onchange=()=>{

    updateDiagnostics();

};


/* =========================================================
   DIAGNOSTICS BUTTON
========================================================= */

document.getElementById(
    "diagnosticButton"
).onclick=()=>{

    diagnostics.classList.toggle(
        "show"
    );

    updateDiagnostics();

};


/* =========================================================
   SCRIPT EDITOR
========================================================= */

document.getElementById(
    "edit"
).onclick=()=>{

    textarea.value =
    scriptText;


    document.getElementById(
        "editor"
    ).style.display =
    "block";

};


document.getElementById(
    "closeEditor"
).onclick=()=>{

    document.getElementById(
        "editor"
    ).style.display =
    "none";

};


document.getElementById(
    "saveScript"
).onclick=()=>{

    scriptText =
    textarea.value;


    localStorage.setItem(
        "tp-script",
        scriptText
    );


    renderScript();


    prompt.scrollTop=0;


    document.getElementById(
        "editor"
    ).style.display =
    "none";

};


/* =========================================================
   INITIALIZE
========================================================= */

scriptEl.style.fontSize =
fontSize+"px";


startCamera();

</script>

</body>
</html>
